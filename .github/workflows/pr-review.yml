name: PR Review & Security

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # AI-powered code review with context
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: PR Agent Review
        uses: Codium-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Comprehensive security and quality checks
  security-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit semgrep pip-audit
          pip install -r requirements.txt

      # Linting and formatting
      - name: Ruff - Lint
        run: |
          ruff check . --output-format=github
        continue-on-error: true

      - name: Ruff - Format Check
        run: |
          ruff format --check .
        continue-on-error: true

      # Type checking
      - name: mypy - Type Safety
        run: |
          mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      # Python security scanning
      - name: Bandit - Security Scan
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -f screen

      # Advanced bug patterns + security rules
      - name: Semgrep - Pattern Analysis
        run: |
          semgrep --config auto . --json -o semgrep-report.json || true
          semgrep --config auto .

      # Dependency vulnerability scanning
      - name: pip-audit - Dependency CVEs
        run: |
          pip-audit -r requirements.txt --format json --output pip-audit-report.json || true
          pip-audit -r requirements.txt
        continue-on-error: true

      # Upload reports as artifacts
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            semgrep-report.json
            pip-audit-report.json

  # Secret scanning
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Gitleaks - Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
